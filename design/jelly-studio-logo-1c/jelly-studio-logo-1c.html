<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jelly Studio — logo 1C</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; background: #0d0d10; display: flex; align-items: center; justify-content: center; gap: 48px; flex-wrap: wrap; padding: 48px; }
  .mark { width: 340px; height: 340px; border-radius: 28px; background: oklch(0.72 0.19 340); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .mark .line { font-family: 'Space Grotesk', Helvetica, sans-serif; font-weight: 700; font-size: 60px; letter-spacing: -0.04em; line-height: 0.98; color: #17131a; }
  .mark .sub { margin-top: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.28em; color: #17131a; opacity: 0.72; }
  .avatar { width: 176px; height: 176px; border-radius: 999px; background: oklch(0.72 0.19 340); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .avatar .line { font-family: 'Space Grotesk', Helvetica, sans-serif; font-weight: 700; font-size: 37px; letter-spacing: -0.03em; line-height: 1.02; color: #17131a; }
</style>
</head>
<body>
  <div class="mark">
    <div class="line">JELLY</div>
    <div class="line">STUDIO</div>
    <div class="sub">TOLLEY.IO</div>
  </div>
  <div class="avatar">
    <div class="line">JELLY</div>
    <div class="line">STUDIO</div>
  </div>
</body>
</html>
