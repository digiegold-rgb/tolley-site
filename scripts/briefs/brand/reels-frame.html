<meta charset="utf-8">
<title>Reels frame — 1080×1920 transparent overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* Persistent branding for the vertical cut. The centre band (y 654–1266) is
     where the 1080×612 video sits, so it stays completely transparent. */
  body { width: 1080px; height: 1920px; }
  .stage { width: 1080px; height: 1920px; }

  .top {
    position: absolute; left: 0; right: 0; top: 300px;
    display: flex; flex-direction: column; align-items: center; gap: 26px;
  }
  .top svg { width: 96px; height: 96px; }
  .top .name {
    font-family: var(--mono); font-weight: 600; font-size: 34px;
    letter-spacing: 0.34em; color: var(--cream); text-indent: 0.34em;
  }
  .top .by { font-family: var(--mono); font-size: 19px; letter-spacing: 0.28em; color: var(--cream-faint); }

  /* Letterbox scrims: the blurred backdrop behind the bands changes brightness
     shot to shot, so the band text needs its own ground or it strobes between
     legible and not. */
  .band {
    position: absolute; left: 0; right: 0; height: 648px;
  }
  .band.top { top: 0; background: linear-gradient(180deg, rgba(13,11,8,0.90) 0%, rgba(13,11,8,0.86) 72%, rgba(13,11,8,0.66) 100%); }
  .band.bottom { top: 1272px; background: linear-gradient(0deg, rgba(13,11,8,0.90) 0%, rgba(13,11,8,0.86) 72%, rgba(13,11,8,0.66) 100%); }

  .strip {
    position: absolute; left: 0; right: 0;
    height: 10px;
    background-image: radial-gradient(circle at 50% 50%, rgba(255, 184, 61, 0.55) 3px, transparent 3.5px);
    background-size: 30px 100%;
  }
  .strip.a { top: 640px; }
  .strip.b { top: 1276px; }

  .bottom {
    position: absolute; left: 0; right: 0; top: 1420px;
    display: flex; flex-direction: column; align-items: center; gap: 26px;
  }
  .bottom .hook {
    font-family: var(--display); font-weight: 700; font-size: 46px;
    letter-spacing: -0.02em; color: var(--cream); text-align: center; line-height: 1.2;
  }
  .bottom .hook .it { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--amber); }
  .bottom .url {
    font-family: var(--mono); font-weight: 700; font-size: 44px;
    letter-spacing: 0.04em; color: var(--amber);
  }
  .bottom .tag {
    font-family: var(--mono); font-size: 20px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--cream-faint);
  }
</style>
<div class="stage">
  <div class="band top"></div>
  <div class="band bottom"></div>

  <div class="top">
    <svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
      <circle cx="350" cy="350" r="310" fill="#15120d" stroke="#ffb83d" stroke-width="34"/>
      <g fill="#0d0b08" stroke="#ffb83d" stroke-width="6" stroke-opacity="0.5">
        <circle cx="350" cy="52" r="26"/><circle cx="648" cy="350" r="26"/>
        <circle cx="350" cy="648" r="26"/><circle cx="52" cy="350" r="26"/>
      </g>
      <text x="352" y="482" text-anchor="middle" fill="#ffb83d"
            font-family="Bricolage Grotesque" font-weight="800" font-size="390">J</text>
    </svg>
    <div>
      <div class="name">JELLY<span style="color:var(--amber)">·</span>STUDIO</div>
      <div class="by" style="text-align:center;margin-top:10px">BY TOLLEY.IO</div>
    </div>
  </div>

  <div class="strip a"></div>
  <div class="strip b"></div>

  <div class="bottom">
    <div class="hook">Typed as a script.<br>Rendered as a <span class="it">finished video.</span></div>
    <div class="url">tolley.io/animate</div>
    <div class="tag">Public beta · invite only</div>
  </div>
</div>
