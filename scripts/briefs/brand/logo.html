<meta charset="utf-8">
<title>Jelly Studio — profile mark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* Everything is sized in em off a viewport-derived root, so the same markup
     renders identically at 1024, 512 or 170 px.
     No wordmark on the avatar by design: at Facebook's 170px it degrades to
     unreadable texture. The wordmark lives on the horizontal lockup and on
     every other asset in the kit. */
  html { font-size: calc(100vw / 1024 * 16); }
  body { width: 100vw; height: 100vw; }
  .stage { width: 100vw; height: 100vw; }
  .inner { display: grid; place-items: center; }

  .jmark {
    width: 47em; height: 47em;
    /* a touch more asymmetry than the base rule: at avatar size this is what
       separates "jelly" from "rounded square" */
    border-radius: 42% 27% 38% 31% / 31% 42% 27% 38%;
    box-shadow: 0 1.4em 3.8em rgba(124, 58, 237, 0.45);
  }
  .jmark .glyph {
    font-size: 28em;
    letter-spacing: -0.03em;
    /* the J's hook is left-weighted; nudge back onto the optical centre */
    transform: translateX(0.055em);
  }
</style>

<div class="stage">
  <div class="glow"></div>
  <div class="inner">
    <div class="jmark"><span class="glyph">J</span></div>
  </div>
  <div class="grain"></div>
</div>
