<meta charset="utf-8">
<title>Jelly Studio — profile mark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* Everything is sized in em off a viewport-derived root, so the exact same
     markup renders at 1024, 512 or 170 px with identical proportions. */
  html { font-size: calc(100vw / 1024 * 16); }
  body { width: 100vw; height: 100vw; }
  .stage { width: 100vw; height: 100vw; border-radius: 0; }

  /* transparent-mark mode also drops the wordmark: mark only */
  body.bare .wordmark { display: none; }

  .inner { display: grid; place-items: center; }
  .lockup { position: relative; width: 100%; height: 100%; }

  .reel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 53em; height: 53em; }

  .jwrap {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: grid; place-items: center;
  }
  .j {
    font-family: var(--display); font-weight: 800; font-size: 27em; line-height: 0.78;
    color: var(--amber); letter-spacing: -0.04em;
    text-shadow: 0 0 2.2em rgba(255, 184, 61, 0.42);
    /* the J is optically a touch left-heavy; nudge it back onto the hub axis */
    transform: translate(0.10em, -0.02em);
  }

  .wordmark {
    position: absolute; left: 0; right: 0; top: 80.5%;
    text-align: center;
    font-family: var(--mono); font-weight: 600;
    font-size: 3.05em; letter-spacing: 0.34em;
    color: var(--cream);
    text-indent: 0.34em; /* re-centre against trailing letter-space */
  }
  .wordmark .sep { color: var(--amber); }
</style>

<div class="stage">
  <div class="glow"></div>
  <div class="inner">
    <div class="lockup">

      <!-- film reel: amber rim, sprocket ring, and a jelly drop falling off the J -->
      <svg class="reel" viewBox="0 0 700 700" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="hub" cx="50%" cy="38%" r="72%">
            <stop offset="0%" stop-color="#241d13"/>
            <stop offset="100%" stop-color="#100d09"/>
          </radialGradient>
        </defs>
        <circle cx="350" cy="350" r="318" fill="url(#hub)"/>
        <circle cx="350" cy="350" r="318" stroke="#ffb83d" stroke-width="13" opacity="0.95"/>
        <circle cx="350" cy="350" r="288" stroke="#ffb83d" stroke-width="2.5" opacity="0.35"/>
        <!-- sprocket holes on the rim -->
        <g fill="#0d0b08" stroke="#ffb83d" stroke-width="2.5" stroke-opacity="0.42">
          <circle cx="350" cy="47"  r="19"/>
          <circle cx="564" cy="136" r="19"/>
          <circle cx="653" cy="350" r="19"/>
          <circle cx="564" cy="564" r="19"/>
          <circle cx="350" cy="653" r="19"/>
          <circle cx="136" cy="564" r="19"/>
          <circle cx="47"  cy="350" r="19"/>
          <circle cx="136" cy="136" r="19"/>
        </g>
      </svg>

      <div class="jwrap"><div class="j">J</div></div>

      <!-- the jelly drop, falling off the hook of the J (point up, heavy bottom) -->
      <svg class="reel" viewBox="0 0 700 700" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M281 452 C 292 489, 310 500, 310 522 a 32 32 0 0 1 -64 0 c 0 -22 20 -33 31 -70 z"
              fill="#ffb83d"/>
        <ellipse cx="266" cy="527" rx="10" ry="7" fill="#fff0cf" opacity="0.5"/>
      </svg>

    </div>
  </div>
  <div class="grain"></div>
</div>
