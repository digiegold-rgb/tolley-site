<meta charset="utf-8">
<title>Jelly Studio — mark, all variants</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* 16px root == the handoff's 340px reference canvas, so every em value in
     _base.css is the spec value divided by 16 and the mark scales exactly. */
  html { font-size: calc(100vw / 340 * 16); }
  body { width: 100vw; height: 100vw; }
  .jmark { width: 100vw; height: 100vw; border-radius: 8.2353%; }

  /* single-colour stamps: no plate, one ink, transparent ground */
  body.mono-black .jmark, body.mono-white .jmark { background: transparent; }
  body.mono-black .jmark .line, body.mono-black .jmark .sub { color: #000000; }
  body.mono-white .jmark .line, body.mono-white .jmark .sub { color: #ffffff; }
</style>

<div class="jmark">
  <div class="line">JELLY</div>
  <div class="line">STUDIO</div>
  <div class="sub">TOLLEY.IO</div>
</div>
