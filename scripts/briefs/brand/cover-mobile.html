<meta charset="utf-8">
<title>Jelly Studio — Facebook cover, mobile 820×360</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* 820×360. On phones Facebook crops hard and the profile circle sits centred
     over the bottom edge, so this is centre-composed with the bottom ~95px empty. */
  body { width: 820px; height: 360px; }
  .stage { width: 820px; height: 360px; }
  .inner { display: flex; flex-direction: column; align-items: center; padding-top: 28px; }

  .lockup .jmark { width: 46px; font-size: calc(46px / 340 * 16); }
  .lockup .name { font-size: 17px; }
  .lockup .by { font-size: 10px; margin-top: 5px; }

  h1 {
    margin-top: 20px; text-align: center;
    font-family: var(--display); font-weight: 700;
    font-size: 37px; line-height: 1.12; letter-spacing: -0.038em; color: var(--off-white);
  }
  h1 .pink { color: var(--pink); }

  .sub {
    margin-top: 15px; text-align: center;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: var(--muted);
  }
  .sub b { color: var(--off-white); font-weight: 500; }

  .url {
    margin-top: 15px;
    font-family: var(--mono); font-weight: 500; font-size: 19px;
    letter-spacing: 0.02em; color: var(--pink);
  }
</style>

<div class="stage">
  <div class="glow"></div>
  <div class="sprockets" style="left:0;right:0;top:0;height:16px;background-size:26px 100%;border-inline:0;border-bottom:1px solid var(--pink-line);"></div>
  <div class="sprockets" style="left:0;right:0;bottom:0;height:16px;background-size:26px 100%;border-inline:0;border-top:1px solid var(--pink-line);"></div>

  <div class="inner">
    <div class="lockup">
      <div class="jmark compact">
        <div class="line">JELLY</div>
        <div class="line">STUDIO</div>
        <div class="sub">TOLLEY.IO</div>
      </div>
      <div>
        <div class="name">Jelly Studio</div>
        <div class="by">BY TOLLEY.IO</div>
      </div>
    </div>

    <h1>The most affordable way<br>to make <span class="pink">faceless videos.</span></h1>
    <p class="sub">Pay only for what you render · <b>no subscription, no commitment</b><br>Most long-form videos cost $1–7</p>
    <div class="url">tolley.io/animate</div>
  </div>
  <div class="grain"></div>
</div>
