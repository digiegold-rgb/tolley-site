<meta charset="utf-8">
<title>Jelly Studio — Facebook cover, mobile 820×360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* 820×360. On phones Facebook crops the cover hard and the profile circle
     sits centred over the bottom edge, so this variant is centre-composed with
     the bottom ~110px kept empty. */
  body { width: 820px; height: 360px; }
  .stage { width: 820px; height: 360px; }
  .inner { display: flex; flex-direction: column; align-items: center; padding-top: 34px; }

  .lockup { display: flex; align-items: center; gap: 11px; }
  .lockup svg { width: 34px; height: 34px; }
  .lockup .name {
    font-family: var(--mono); font-weight: 600; font-size: 15px;
    letter-spacing: 0.30em; color: var(--cream);
  }
  .lockup .by {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
    color: var(--cream-faint);
  }

  h1 {
    margin-top: 20px; text-align: center;
    font-family: var(--display); font-weight: 750;
    font-size: 37px; line-height: 1.12; letter-spacing: -0.028em; color: var(--cream);
  }
  h1 .it { font-size: 39px; letter-spacing: -0.01em; }

  .sub {
    margin-top: 15px; text-align: center;
    font-family: var(--mono); font-size: 13px; line-height: 1.7;
    color: var(--cream-dim);
  }
  .sub b { color: var(--cream); font-weight: 600; }

  .url {
    margin-top: 16px;
    font-family: var(--mono); font-size: 19px; font-weight: 700;
    letter-spacing: 0.05em; color: var(--amber);
  }
</style>

<div class="stage">
  <div class="glow"></div>
  <div class="sprockets" style="left:0;right:0;top:0;height:16px;background-size:26px 100%;border-inline:0;border-bottom:1px solid var(--line);"></div>
  <div class="sprockets" style="left:0;right:0;bottom:0;height:16px;background-size:26px 100%;border-inline:0;border-top:1px solid var(--line);"></div>

  <div class="inner">
    <div class="lockup">
      <svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
        <circle cx="350" cy="350" r="310" fill="#15120d" stroke="#ffb83d" stroke-width="34"/>
        <g fill="#0d0b08" stroke="#ffb83d" stroke-width="6" stroke-opacity="0.5">
          <circle cx="350" cy="52" r="26"/><circle cx="648" cy="350" r="26"/>
          <circle cx="350" cy="648" r="26"/><circle cx="52" cy="350" r="26"/>
        </g>
        <text x="352" y="470" text-anchor="middle" fill="#ffb83d"
              font-family="Bricolage Grotesque" font-weight="800" font-size="360">J</text>
      </svg>
      <div>
        <div class="name">JELLY<span style="color:var(--amber)">·</span>STUDIO</div>
        <div class="by">BY TOLLEY.IO</div>
      </div>
    </div>

    <h1>The most affordable way<br>to make <span class="it">faceless videos.</span></h1>
    <p class="sub">Pay only for what you render · <b>no subscription, no commitment</b><br>Most long-form videos cost $1–7</p>
    <div class="url">tolley.io/animate</div>
  </div>
  <div class="grain"></div>
</div>
