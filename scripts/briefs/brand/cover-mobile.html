<meta charset="utf-8">
<title>Jelly Studio — Facebook cover, mobile 820×360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* 820×360. On phones Facebook crops hard and the profile circle sits centred
     over the bottom edge, so this variant is centre-composed with the bottom
     ~100px kept empty. */
  body { width: 820px; height: 360px; }
  .stage { width: 820px; height: 360px; }
  .inner { display: flex; flex-direction: column; align-items: center; padding-top: 30px; }

  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup .jmark { width: 40px; height: 40px; box-shadow: 0 5px 14px rgba(124, 58, 237, 0.45); }
  .lockup .jmark .glyph { font-size: 24px; transform: translateX(0.055em); }
  .lockup .name {
    font-family: var(--mono); font-weight: 600; font-size: 15px;
    letter-spacing: 0.30em; color: var(--text);
  }
  .lockup .by { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: var(--text-3); margin-top: 4px; }

  h1 {
    margin-top: 20px; text-align: center;
    font-family: var(--display); font-weight: 750;
    font-size: 37px; line-height: 1.12; letter-spacing: -0.028em; color: var(--text);
  }
  h1 .it { font-size: 39px; letter-spacing: -0.01em; }

  .sub {
    margin-top: 15px; text-align: center;
    font-family: var(--mono); font-size: 13px; line-height: 1.7; color: var(--text-2);
  }
  .sub b { color: var(--text); font-weight: 600; }

  .url {
    margin-top: 16px;
    font-family: var(--mono); font-size: 19px; font-weight: 700;
    letter-spacing: 0.05em; color: var(--brand-light);
  }
</style>

<div class="stage">
  <div class="glow"></div>
  <div class="sprockets" style="left:0;right:0;top:0;height:16px;background-size:26px 100%;border-inline:0;border-bottom:1px solid var(--brand-line);"></div>
  <div class="sprockets" style="left:0;right:0;bottom:0;height:16px;background-size:26px 100%;border-inline:0;border-top:1px solid var(--brand-line);"></div>

  <div class="inner">
    <div class="lockup">
      <div class="jmark"><span class="glyph">J</span></div>
      <div>
        <div class="name">JELLY<span style="color:var(--brand-light)">·</span>STUDIO</div>
        <div class="by">BY TOLLEY.IO</div>
      </div>
    </div>

    <h1>The most affordable way<br>to make <span class="it">faceless videos.</span></h1>
    <p class="sub">Pay only for what you render · <b>no subscription, no commitment</b><br>Most long-form videos cost $1–7</p>
    <div class="url">tolley.io/animate</div>
  </div>
  <div class="grain"></div>
</div>
