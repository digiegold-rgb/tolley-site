<meta charset="utf-8">
<title>Jelly Studio — mark candidates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* Three candidates, each shown at 300 / 170 / 48 px — 170 is the Facebook
     profile size and 48 is the feed avatar, so anything that dies small dies
     here first. */
  body { width: 1500px; height: 620px; }
  .stage { width: 1500px; height: 620px; }
  .inner { display: flex; padding: 40px 44px; gap: 34px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .cap {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--brand-light);
  }
  .desc { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); text-align: center; line-height: 1.6; }
  .sizes { display: flex; align-items: center; gap: 22px; }
  .circle { border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--body); }

  /* ── A: jelly-wobble squircle + bold J ── */
  .a-300 { width: 300px; height: 300px; } .a-300 .glyph { font-size: 176px; }
  .a-170 { width: 170px; height: 170px; } .a-170 .glyph { font-size: 100px; }
  .a-48  { width: 48px;  height: 48px;  } .a-48  .glyph { font-size: 28px; }

  /* ── B: film frame + play triangle ── */
  .bmark {
    position: relative; background: var(--card);
    border: 1px solid var(--brand-outline);
    display: grid; place-items: center;
  }
  .bmark .rail {
    position: absolute; top: 12%; bottom: 12%; width: 7%;
    background-image: radial-gradient(circle at 50% 50%, var(--brand) 42%, transparent 46%);
    background-size: 100% 25%;
  }
  .bmark .rail.l { left: 5.5%; } .bmark .rail.r { right: 5.5%; }
  .bplay {
    width: 34%; height: 40%;
    background: var(--grad);
    clip-path: polygon(6% 0%, 100% 50%, 6% 100%);
    border-radius: 12%;
  }
  .b-300 { width: 300px; height: 300px; border-radius: 64px; }
  .b-170 { width: 170px; height: 170px; border-radius: 36px; }
  .b-48  { width: 48px;  height: 48px;  border-radius: 11px; border-width: 1px; }

  /* ── C: wobble blob + play triangle (no letter) ── */
  .cmark {
    position: relative; display: grid; place-items: center;
    background: var(--grad);
    border-radius: 34% 30% 33% 29% / 30% 34% 29% 33%;
    box-shadow: 0 0.14em 0.5em rgba(124, 58, 237, 0.42);
  }
  .cmark::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(150deg, rgba(255,255,255,0.26), transparent 52%);
  }
  .cplay {
    position: relative; width: 36%; height: 42%;
    background: #ffffff;
    clip-path: polygon(8% 0%, 100% 50%, 8% 100%);
    border-radius: 14%;
  }
  .c-300 { width: 300px; height: 300px; }
  .c-170 { width: 170px; height: 170px; }
  .c-48  { width: 48px;  height: 48px;  }
</style>

<div class="stage">
  <div class="glow"></div>
  <div class="inner">

    <div class="col">
      <div class="cap">A · wobble + J</div>
      <div class="sizes">
        <div class="jmark a-300"><span class="glyph">J</span></div>
        <div class="circle" style="width:170px;height:170px"><div class="jmark a-170"><span class="glyph">J</span></div></div>
        <div class="jmark a-48"><span class="glyph">J</span></div>
      </div>
      <div class="desc">Letter-first. Owns the name,<br>survives the 48px avatar.</div>
    </div>

    <div class="col">
      <div class="cap">B · film frame + play</div>
      <div class="sizes">
        <div class="bmark b-300"><div class="rail l"></div><div class="rail r"></div><div class="bplay"></div></div>
        <div class="circle" style="width:170px;height:170px"><div class="bmark b-170"><div class="rail l"></div><div class="rail r"></div><div class="bplay"></div></div></div>
        <div class="bmark b-48"><div class="rail l"></div><div class="rail r"></div><div class="bplay"></div></div>
      </div>
      <div class="desc">Says "video" instantly.<br>Rails vanish under 64px.</div>
    </div>

    <div class="col">
      <div class="cap">C · wobble + play</div>
      <div class="sizes">
        <div class="cmark c-300"><div class="cplay"></div></div>
        <div class="circle" style="width:170px;height:170px"><div class="cmark c-170"><div class="cplay"></div></div></div>
        <div class="cmark c-48"><div class="cplay"></div></div>
      </div>
      <div class="desc">Soft + unmistakably play.<br>Generic without the name.</div>
    </div>

  </div>
  <div class="grain"></div>
</div>
