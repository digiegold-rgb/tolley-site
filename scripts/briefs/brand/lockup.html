<meta charset="utf-8">
<title>Jelly Studio — horizontal lockup</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* The 1C mark is itself a wordmark, so a horizontal lockup that repeats
     "JELLY STUDIO" beside it would just say the name twice. Instead the mark
     sits next to what it does and where to find it. */
  body { width: 1600px; height: 400px; }
  .stage { width: 1600px; height: 400px; }
  .inner { display: flex; align-items: center; justify-content: center; gap: 54px; }

  .jmark { width: 244px; font-size: calc(244px / 340 * 16); }

  .rule { width: 1px; height: 168px; background: var(--hairline); }

  .what {
    font-family: var(--display); font-weight: 700; font-size: 46px;
    letter-spacing: -0.035em; line-height: 1.14; color: var(--off-white);
  }
  .what .pink { color: var(--pink); }
  .url {
    margin-top: 22px; font-family: var(--mono); font-weight: 500;
    font-size: 25px; letter-spacing: 0.02em; color: var(--pink);
  }
  .tag {
    margin-top: 16px; font-family: var(--mono); font-size: 14px;
    letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted);
  }
</style>

<div class="stage">
  <div class="glow"></div>
  <div class="inner">
    <div class="jmark">
      <div class="line">JELLY</div>
      <div class="line">STUDIO</div>
      <div class="sub">TOLLEY.IO</div>
    </div>

    <div class="rule"></div>

    <div>
      <div class="what">The most affordable way<br>to make <span class="pink">faceless videos.</span></div>
      <div class="url">tolley.io/animate</div>
      <div class="tag">Public beta · invite only</div>
    </div>
  </div>
  <div class="grain"></div>
</div>
