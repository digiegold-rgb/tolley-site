<meta charset="utf-8">
<title>End card — 1080×1920 overlay</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  body { width: 1080px; height: 1920px; }
  .stage { width: 1080px; height: 1920px; }
  .scrim {
    position: absolute; inset: 0;
    background: radial-gradient(80% 55% at 50% 47%, rgba(13, 13, 16, 0.975), rgba(13, 13, 16, 0.995));
  }
  .inner { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .jmark { width: 280px; font-size: calc(280px / 340 * 16); }

  .made {
    margin-top: 52px; font-family: var(--display); font-weight: 500;
    font-size: 40px; letter-spacing: -0.02em; color: var(--muted);
  }
  .url {
    margin-top: 30px; font-family: var(--mono); font-weight: 500;
    font-size: 49px; letter-spacing: 0.02em; color: var(--pink);
  }
  .tag {
    margin-top: 32px; font-family: var(--mono); font-size: 21px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--muted);
  }
</style>
<div class="stage">
  <div class="scrim"></div>
  <div class="inner">
    <div class="jmark">
      <div class="line">JELLY</div><div class="line">STUDIO</div><div class="sub">TOLLEY.IO</div>
    </div>
    <div class="made">made with Jelly Studio</div>
    <div class="url">tolley.io/animate</div>
    <div class="tag">Public beta · invite only</div>
  </div>
</div>
