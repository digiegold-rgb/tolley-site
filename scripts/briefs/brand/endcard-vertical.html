<meta charset="utf-8">
<title>End card — 1080×1920 overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  body { width: 1080px; height: 1920px; }
  .stage { width: 1080px; height: 1920px; }
  .scrim {
    position: absolute; inset: 0;
    background: radial-gradient(80% 55% at 50% 47%, rgba(10, 10, 16, 0.975), rgba(10, 10, 16, 0.995));
  }
  .inner { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .jmark { width: 194px; height: 194px; box-shadow: 0 18px 52px rgba(124, 58, 237, 0.5); }
  .jmark .glyph { font-size: 118px; transform: translateX(0.055em); }

  .name {
    margin-top: 40px; font-family: var(--mono); font-weight: 600;
    font-size: 44px; letter-spacing: 0.34em; color: var(--text); text-indent: 0.34em;
  }
  .made {
    margin-top: 28px; font-family: var(--display); font-weight: 500;
    font-size: 40px; color: var(--text-2);
  }
  .url {
    margin-top: 44px; font-family: var(--mono); font-weight: 700;
    font-size: 50px; letter-spacing: 0.04em; color: var(--brand-light);
  }
  .tag {
    margin-top: 36px; font-family: var(--mono); font-size: 22px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--text-3);
  }
</style>
<div class="stage">
  <div class="scrim"></div>
  <div class="inner">
    <div class="jmark"><span class="glyph">J</span></div>
    <div class="name">JELLY<span style="color:var(--brand-light)">·</span>STUDIO</div>
    <div class="made">made with Jelly Studio</div>
    <div class="url">tolley.io/animate</div>
    <div class="tag">Public beta · invite only</div>
  </div>
</div>
