<meta charset="utf-8">
<title>Jelly Studio — Facebook cover 1640×624</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
  /* 1640×624. Facebook's own safe area is the centred 1200×624; on desktop the
     176px profile circle also punches the lower-LEFT corner, so nothing that
     has to be read lives below y≈300 left of x≈470. */
  body { width: 1640px; height: 624px; }
  .stage { width: 1640px; height: 624px; }

  .lockup {
    position: absolute; left: 250px; top: 66px;
    display: flex; align-items: center; gap: 14px;
  }
  .lockup svg { width: 50px; height: 50px; }
  .lockup .name {
    font-family: var(--mono); font-weight: 600; font-size: 19px;
    letter-spacing: 0.30em; color: var(--cream);
  }
  .lockup .by {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.22em;
    color: var(--cream-faint); margin-left: 2px;
  }

  .copy { position: absolute; left: 470px; top: 132px; width: 580px; }

  .badge { font-size: 13.5px; padding: 9px 19px; }

  h1 {
    margin: 22px 0 0;
    font-family: var(--display); font-weight: 750;
    font-size: 45px; line-height: 1.1; letter-spacing: -0.026em;
    color: var(--cream);
  }
  h1 .it { font-size: 48px; letter-spacing: -0.01em; }

  .sub {
    margin-top: 24px; max-width: 640px;
    font-family: var(--mono); font-size: 18px; line-height: 1.75;
    letter-spacing: 0.01em; color: var(--cream-dim);
  }
  .sub b { color: var(--cream); font-weight: 600; }

  .url {
    position: absolute; left: 470px; top: 466px;
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 25px; font-weight: 700;
    letter-spacing: 0.05em; color: var(--amber);
  }
  .url .arrow { color: var(--amber); font-size: 19px; }

  .note {
    position: absolute; left: 470px; top: 519px;
    font-family: var(--mono); font-size: 15px; letter-spacing: 0.11em;
    text-transform: uppercase; color: var(--cream-faint);
  }

  /* right: a real render, in a screening card with a sprocket rail */
  .screen {
    position: absolute; right: 224px; top: 128px; width: 330px;
    background: linear-gradient(160deg, var(--panel), var(--ink-2));
    border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 13px 11px;
    box-shadow: 0 34px 80px -30px rgba(0, 0, 0, 0.9);
  }
  .screen .rail { left: -15px; top: 0; bottom: 0; width: 9px; }
  .screen .head {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
    color: var(--cream-faint); text-transform: uppercase;
    padding-bottom: 10px; border-bottom: 1px dashed var(--line);
  }
  .screen .head .run { color: var(--amber); }
  .screen img {
    display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
    border-radius: 5px; border: 1px solid var(--line); background: #000;
    margin-top: 11px;
  }
  .screen .foot {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-family: var(--mono);
  }
  .screen .foot .ttl { font-size: 13px; color: var(--cream-dim); }
  .screen .foot .cost { font-size: 22px; font-weight: 600; color: var(--good); }
  .screen .foot .cost small { font-size: 11px; color: var(--cream-faint); font-weight: 400; letter-spacing: 0.1em; }
</style>

<div class="stage">
  <div class="glow"></div>

  <!-- outer filmstrip rails, top and bottom edge -->
  <div class="sprockets" style="left:0;right:0;top:0;height:22px;background-size:34px 100%;border-inline:0;border-bottom:1px solid var(--line);"></div>
  <div class="sprockets" style="left:0;right:0;bottom:0;height:22px;background-size:34px 100%;border-inline:0;border-top:1px solid var(--line);"></div>

  <div class="inner">

    <div class="lockup">
      <svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
        <circle cx="350" cy="350" r="310" fill="#15120d" stroke="#ffb83d" stroke-width="34"/>
        <g fill="#0d0b08" stroke="#ffb83d" stroke-width="6" stroke-opacity="0.5">
          <circle cx="350" cy="52" r="26"/><circle cx="648" cy="350" r="26"/>
          <circle cx="350" cy="648" r="26"/><circle cx="52" cy="350" r="26"/>
        </g>
        <text x="352" y="470" text-anchor="middle" fill="#ffb83d"
              font-family="Bricolage Grotesque" font-weight="800" font-size="360">J</text>
      </svg>
      <div>
        <div class="name">JELLY<span style="color:var(--amber)">·</span>STUDIO</div>
        <div class="by">BY TOLLEY.IO</div>
      </div>
    </div>

    <div class="copy">
      <div class="badge"><span class="dot"></span>PUBLIC BETA · INVITE ONLY</div>
      <h1>The most affordable way<br>to make <span class="it">faceless videos.</span></h1>
      <p class="sub">
        Pay only for what you render.<br>
        <b>No subscription. No commitment.</b><br>
        Most long-form videos cost $1–7.
      </p>
    </div>

    <div class="url"><span class="arrow">▸</span>tolley.io/animate</div>
    <div class="note">Cloned voice · generated scenes, not stock · no watermark</div>

    <figure class="screen">
      <div class="sprockets rail"></div>
      <div class="head"><span>Made in Jelly Studio</span><span class="run">3:24</span></div>
      <img src="frame-a.jpg" alt="">
      <div class="foot">
        <span class="ttl">The Quiet Exit</span>
        <span class="cost">$3.04 <small>ALL IN</small></span>
      </div>
    </figure>

  </div>
  <div class="grain"></div>
</div>
